<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KrisVideos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="top">
  <button id="projBtn" class="projbtn" title="Switch vlog"><span id="projTitle">KrisVideos</span><span class="chev">›</span></button>
  <span id="projMeta" class="meta"></span>
  <button id="undoBtn" class="iconbtn" title="Undo (⌘Z)" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 2.5 7.5 6 11"/><path d="M3 7.5h6.5a3.5 3.5 0 0 1 0 7H8"/></svg></button>
  <button id="redoBtn" class="iconbtn" title="Redo (⇧⌘Z)" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10 4 3.5 3.5L10 11"/><path d="M13 7.5H6.5a3.5 3.5 0 0 0 0 7H8"/></svg></button>
  <span class="spacer"></span>
  <button id="addBtn" class="pill">+ Add</button>
  <button id="scriptBtn" class="pill ghost" title="Edit the project script">Script</button>
  <button id="renderPreviewBtn" class="pill ghost" title="Render an accurate preview with transitions, music and narration (⌘⏎)">Render preview</button>
  <button id="exportBtn" class="pill primary" title="Export the finished video (⇧⌘⏎)">Export ▾</button>
  <button id="gearBtn" class="iconbtn" title="Settings">⚙︎</button>
</header>

<main id="app" class="hidden">
  <section id="stage">
    <div id="playerBox">
      <div id="canvas">
        <video id="vA" playsinline preload="auto"></video>
        <video id="vB" playsinline preload="auto" class="hidden"></video>
        <div id="cardA" class="tcard hidden"><div class="rule"></div><div class="t"></div><div class="s"></div></div>
        <div id="cardB" class="tcard hidden"><div class="rule"></div><div class="t"></div><div class="s"></div></div>
        <div id="capLayer"></div>
        <div id="stageEmpty" class="hidden"></div>
        <div id="modeChip"></div>
      </div>
    </div>
    <div id="transport">
      <button id="playBtn" class="playbtn" title="Play / pause (space)"><svg viewBox="0 0 16 16" width="16" height="16"><path id="playIcon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></button>
      <span id="tNow" class="tc">0:00.0</span>
      <div id="scrubber"><div class="rail"></div><div class="fill"></div><div class="knob"></div></div>
      <span id="tTotal" class="tc muted">0:00.0</span>
    </div>
    <div id="jobBar" class="hidden"><div class="bar"><div class="fill"></div></div><span class="msg"></span><button class="link" id="jobCancel">Cancel</button></div>
    <div id="doneBar" class="hidden"><span class="msg"></span><button class="link" id="revealBtn">Show in Finder</button><button class="link" id="openBtn">Open</button><button class="link muted" id="doneClose">✕</button></div>
    <div id="recoverBar" class="hidden"><span class="msg"></span><button class="link" id="recoverBtn">Recover</button><button class="link muted" id="discardBtn">Discard</button></div>

    <div id="tlWrap">
      <div id="ctx">
        <button class="link" data-act="split" title="Split the clip at the playhead (S)">Split</button>
        <button class="link" data-act="title" title="Cut to a title card here (T)">Cut to title</button>
        <button class="link" data-act="trimStart" title="Trim the clip's start to the playhead (I)">Trim start</button>
        <button class="link" data-act="trimEnd" title="Trim the clip's end to the playhead (O)">Trim end</button>
        <span class="spacer"></span>
        <button class="link" data-act="addTitle">+ Title</button>
        <button class="link" data-act="record">⏺ Record</button>
        <button class="link" data-act="music">♫ Music</button>
        <span class="zoom"><button class="iconbtn sm" id="zoomOut" title="Zoom out (⌘−)">−</button><button class="link muted" id="zoomFit" title="Fit (⌘0)">fit</button><button class="iconbtn sm" id="zoomIn" title="Zoom in (⌘+)">+</button></span>
        <button class="iconbtn sm" id="helpBtn" title="Keyboard shortcuts (?)">?</button>
      </div>
      <div id="tl">
        <div id="ruler"></div>
        <div id="track"><div id="tlEmpty" class="hidden">Add your first clips with <b>+ Add</b> above, or press <b>R</b> to record.</div></div>
        <div id="lanes"></div>
        <div id="playhead"><div class="head"></div></div>
      </div>
    </div>
  </section>

  <aside id="inspector" class="hidden"><div id="inspBody"></div></aside>
</main>

<div id="welcome" class="hidden">
  <div class="mark"></div>
  <h1>KrisVideos</h1>
  <p>Daily vlogs, out the door in minutes.</p>
  <button id="welcomeNew" class="pill primary">Start today's vlog</button>
</div>

<div id="sheet" class="hidden"><div class="sheetbox"><div id="sheetBody"></div></div></div>
<div id="popover" class="hidden"></div>
<div id="toast" class="hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
