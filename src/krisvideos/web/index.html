<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KrisVideos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="top">
  <button id="projBtn" class="projbtn" title="Switch vlog"><span id="projTitle">KrisVideos</span><span class="chev">›</span></button>
  <span id="projMeta" class="meta"></span>
  <button id="undoBtn" class="iconbtn" title="Undo (⌘Z)" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 2.5 7.5 6 11"/><path d="M3 7.5h6.5a3.5 3.5 0 0 1 0 7H8"/></svg></button>
  <button id="redoBtn" class="iconbtn" title="Redo (⇧⌘Z)" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10 4 3.5 3.5L10 11"/><path d="M13 7.5H6.5a3.5 3.5 0 0 0 0 7H8"/></svg></button>
  <span class="spacer"></span>
  <button id="addBtn" class="pill">+ Add</button>
  <button id="scriptBtn" class="pill ghost" title="Edit the project script">Script</button>
  <button id="renderPreviewBtn" class="pill ghost" title="Render an accurate preview with transitions, music and narration (⌘⏎)">Render preview</button>
  <button id="exportBtn" class="pill primary" title="Export the finished video (⇧⌘⏎)">Export ▾</button>
  <button id="gearBtn" class="iconbtn" title="Settings">⚙︎</button>
</header>

<main id="app" class="hidden">
  <section id="stage">
    <div id="playerBox">
      <div id="canvas">
        <video id="vA" playsinline preload="auto"></video>
        <video id="vB" playsinline preload="auto" class="hidden"></video>
        <div id="cardA" class="tcard hidden"><div class="bg"></div><div class="pic"></div><div class="k"></div><div class="rule"></div><div class="t"></div><div class="s"></div></div>
        <div id="cardB" class="tcard hidden"><div class="bg"></div><div class="pic"></div><div class="k"></div><div class="rule"></div><div class="t"></div><div class="s"></div></div>
        <div id="pipBox" class="pipbox hidden" title="Drag to move the inset; drag a corner to resize"><video id="vP" playsinline preload="auto" muted></video><i class="rz tl" data-c="tl"></i><i class="rz tr" data-c="tr"></i><i class="rz bl" data-c="bl"></i><i class="rz br" data-c="br"></i></div>
        <div id="capLayer"></div>
        <div id="layerLayer"></div>
        <div id="stageEmpty" class="hidden"></div>
        <div id="modeChip"></div>
      </div>
    </div>
    <div id="jobBar" class="hidden"><div class="bar"><div class="fill"></div></div><span class="msg"></span><button class="link" id="jobCancel">Cancel</button></div>
    <div id="doneBar" class="hidden"><span class="msg"></span><button class="link" id="revealBtn">Show in Finder</button><button class="link" id="openBtn">Open</button><button class="link muted" id="doneClose">✕</button></div>
    <div id="recoverBar" class="hidden"><span class="msg"></span><button class="link" id="recoverBtn">Recover</button><button class="link muted" id="discardBtn">Discard</button></div>

    <div id="tlWrap">
      <div id="ctx">
        <button id="playBtn" class="playbtn" title="Play / pause (space)"><svg viewBox="0 0 16 16" width="14" height="14"><path id="playIcon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></button>
        <span class="tc"><span id="tNow">0:00.0</span><span class="muted"> / <span id="tTotal">0:00.0</span></span></span>
        <span class="vsep"></span>
        <button class="link" data-act="markIn" title="Mark the start of a part at the playhead (I)">Mark in <kbd>I</kbd></button>
        <button class="link" data-act="markOut" title="Mark the end of a part at the playhead (O)">Mark out <kbd>O</kbd></button>
        <button class="link" data-act="split" title="Split the clip at the playhead (S)">✂ Split <kbd>S</kbd></button>
        <button class="link" data-act="title" title="Cut to a title card at the playhead (T)">Title here</button>
        <span id="rangeChip" class="hidden"><span id="rangeLbl"></span><button class="link" data-act="keepRange" title="Trim the clip(s) so only the marked part remains (K)">Keep <kbd>K</kbd></button><button class="link danger" data-act="cutRange" title="Remove the marked part and close the gap (⌫)">Cut out <kbd>⌫</kbd></button><button class="link muted" data-act="clearRange" title="Clear the marks (esc)">✕</button></span>
        <span class="ctxright">
          <button class="link" data-act="addTitle">+ Title</button>
          <button class="link" data-act="record">⏺ Record</button>
          <button class="link" data-act="music">♫ Music</button>
          <span class="zoom"><button class="link muted" id="scaleBtn"></button><button class="iconbtn sm" id="zoomOut" title="Zoom out (⌘−)">−</button><button class="link muted" id="zoomFit" title="Fit (⌘0)">fit</button><button class="iconbtn sm" id="zoomIn" title="Zoom in (⌘+)">+</button></span>
          <button class="iconbtn sm" id="helpBtn" title="Keyboard shortcuts (?)">?</button>
        </span>
      </div>
      <div id="tl">
        <div id="tlInner">
          <div id="ruler"></div>
          <div id="imgLane"></div>
          <div id="track"><div id="tlEmpty" class="hidden">Add your first clips with <b>+ Add</b> above, or press <b>R</b> to record.</div></div>
          <div id="lanes"></div>
          <div id="range" class="hidden"><div class="edge l" title="Drag to move the in mark"></div><div class="edge r" title="Drag to move the out mark"></div></div>
          <div id="playhead"><div class="head" title="Drag to scrub"></div></div>
        </div>
      </div>
    </div>
  </section>

  <aside id="inspector" class="hidden"><div id="inspBody"></div></aside>
</main>

<div id="welcome" class="hidden">
  <div class="mark"></div>
  <h1>KrisVideos</h1>
  <p>Daily vlogs, out the door in minutes.</p>
  <button id="welcomeNew" class="pill primary">Start today's vlog</button>
</div>

<div id="sheet" class="hidden"><div class="sheetbox"><div id="sheetBody"></div></div></div>
<div id="popover" class="hidden"></div>
<div id="toast" class="hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
