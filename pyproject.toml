[project]
name = "krisvideos"
version = "0.1.0"
description = "Push-button daily vlog editor for Mac: Immich in, finished video out."
readme = "README.md"
authors = [
    { name = "Kristopher Micinski", email = "krismicinski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vlog = "krisvideos.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
